name: ipostmap_flutter
version: 1.0.0
description: A Flutter plugin for integrating iPostMap in iOS and Android applications.
homepage: https://ipostmap.vn
repository: https://github.com/ipostmap/ipostmap-flutter
issue_tracker: https://github.com/ipostmap/ipostmap-flutter/issues

environment:
  sdk: ">=2.14.0 <4.0.0"
  flutter: ">=1.22.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.3.0
  collection: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: vn.map4d.map.map4d_map
        pluginClass: FMFMapViewPlugin
      ios:
        pluginClass: Map4dMapPlugin
